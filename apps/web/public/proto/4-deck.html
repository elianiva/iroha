<!doctype html><meta charset="utf-8" /><meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/><title>Deck</title>
<link rel="stylesheet" href="base.css" />
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #ffe14d;
    font-family: 'Arial Black', 'Helvetica Neue', 'Hiragino Sans', sans-serif;
    color: #000;
  }
  .nav {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 4px solid #000;
    background: #fff;
    font-weight: 900;
    text-transform: uppercase;
  }
  .nav select {
    font: inherit;
    border: 3px solid #000;
    background: #ffe14d;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 20px;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 34px;
    align-items: center;
  }
  h1 {
    font-size: clamp(44px, 8vw, 84px);
    line-height: 0.9;
    margin: 0;
    text-transform: uppercase;
  }
  h1 span {
    background: #000;
    color: #ffe14d;
    padding: 0 0.1em;
  }
  .mode {
    display: flex;
    gap: 8px;
    margin: 18px 0;
  }
  .mode button,
  .btns button {
    font: inherit;
    padding: 10px 14px;
    border: 4px solid #000;
    background: #fff;
    box-shadow: 4px 4px 0 #000;
    cursor: pointer;
    text-transform: uppercase;
    font-size: 13px;
  }
  .mode button.on {
    background: #000;
    color: #ffe14d;
  }
  .stack {
    position: relative;
    height: 440px;
  }
  .card {
    position: absolute;
    inset: 0;
    border: 4px solid #000;
    box-shadow: 10px 10px 0 #000;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    background: var(--b);
    transition: transform 0.3s;
    overflow: auto;
  }
  .card:nth-child(1) {
    transform: rotate(-4deg) translate(-12px, 8px);
  }
  .card:nth-child(2) {
    transform: rotate(3deg) translate(10px, 4px);
  }
  .tag {
    align-self: flex-start;
    background: #000;
    color: #fff;
    padding: 3px 10px;
    font-size: 12px;
  }
  .front {
    font:
      700 76px/1.2 'Hiragino Mincho ProN',
      serif;
    text-align: center;
    word-break: keep-all;
  }
  .back {
    opacity: 0;
    text-align: center;
    font: 700 22px Helvetica;
  }
  .card.flip .back {
    opacity: 1;
  }
  .card.flip .front {
    font-size: 44px;
  }
  .btns {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btns button {
    flex: 1;
  }
  .g {
    background: #7dff8a !important;
  }
  .b {
    background: #ff7a7a !important;
  }
  .ir-in {
    border: 3px solid #000;
    width: 5em;
    background: #fff;
  }
  .ir-check {
    border: 3px solid #000;
    background: #000;
    color: #fff;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  .ir-fillrow {
    font: 700 24px 'Hiragino Sans';
  }
  @media (max-width: 760px) {
    .wrap {
      grid-template-columns: 1fr;
    }
  }
</style>
<div class="nav">
  <span>IRODORI!!</span
  ><select id="sel"></select
  ><span id="cnt"></span>
</div>
<div class="wrap">
  <div>
    <h1>Learn it. <span>Slap</span> it.</h1>
    <div class="mode" id="mode"></div>
    <div class="btns">
      <button class="b" id="no">Again</button><button class="g" id="yes">Got it</button>
    </div>
  </div>
  <div class="stack" id="s"></div>
</div>
<script src="lib.js"></script>
<script>
  IR.wire()
  const COLORS = ['#ff6b9a', '#5ad1ff', '#fff', '#b8ff7a']
  let L,
    decks,
    cur = 'vocab',
    cards = [],
    n = 0
  function build(l) {
    const vocab = []
    l.activities.forEach((a) =>
      a.steps.forEach((s) => {
        const w = (k) => {
          k.vocab.forEach((v) => vocab.push({ tag: 'Vocab', f: IR.t(v.ja), b: IR.esc(v.en) }))
          ;(k.subtasks || []).forEach(w)
        }
        s.tasks.forEach(w)
      }),
    )
    const kj = l.kanji.words.map((w) => ({ tag: 'Kanji word', f: IR.plain(w), b: IR.t(w) }))
    const fills = []
    l.activities.forEach((a) =>
      IR.units(a).forEach((u) => {
        if (u.task.quiz?.type === 'fill')
          u.task.quiz.items.forEach((it) =>
            fills.push({
              tag: 'Fill in',
              f: it.parts
                .map(IR.t)
                .join('<span style="border-bottom:5px solid #000;padding:0 .7em"> </span>')
                .replace(
                  /^/,
                  '<span style="font-size:.5em;display:block">' +
                    IR.esc(u.task.hints?.[0]?.ja?.text ?? u.task.instruction_en) +
                    '</span>',
                ),
              b: it.answers.map((a) => a.map((x) => IR.t(x)).join('・')).join(' / '),
            }),
          )
      }),
    )
    return { vocab, kanji: kj, fill: fills }
  }
  function draw() {
    s.innerHTML = ''
    if (n >= cards.length) {
      s.innerHTML = `<div class=card style="--b:#7dff8a"><span class=tag>Done</span><div class=front style="font-size:64px">完了</div><div class=back style="opacity:1">${cards.length} cards</div></div>`
      cnt.textContent = ''
      return
    }
    for (let k = Math.min(2, cards.length - n - 1); k >= 0; k--) {
      const c = cards[n + k],
        d = document.createElement('div')
      d.className = 'card'
      d.style.setProperty('--b', COLORS[(n + k) % 4])
      d.innerHTML = `<span class=tag>${c.tag} · ${n + k + 1}/${cards.length}</span><div class=front>${c.f}</div><div class=back>${c.b}</div>`
      if (!k) d.onclick = () => d.classList.toggle('flip')
      s.appendChild(d)
    }
    cnt.textContent = `${n + 1}/${cards.length}`
  }
  function go(g) {
    const c = s.lastElementChild
    if (!c || n >= cards.length) return
    c.style.transform = `translateX(${g ? '' : '-'}130%) rotate(${g ? 20 : -20}deg)`
    setTimeout(() => {
      if (!g) cards.push(cards[n])
      n++
      draw()
    }, 280)
  }
  function setMode(m) {
    cur = m
    cards = [...decks[m]]
    n = 0
    mode.innerHTML = Object.keys(decks)
      .map(
        (k) => `<button class="${k == m ? 'on' : ''}" data-m=${k}>${k} ${decks[k].length}</button>`,
      )
      .join('')
    draw()
  }
  mode.onclick = (e) => {
    const b = e.target.closest('button')
    if (b) setMode(b.dataset.m)
  }
  yes.onclick = () => go(1)
  no.onclick = () => go(0)
  Promise.all([IR.index(), IR.load(IR.lessonNo())]).then(([ix, l]) => {
    sel.innerHTML = ix.chapters
      .flatMap((c) => c.lessons)
      .map(
        (x) =>
          `<option value=${x.number} ${x.number == l.number ? 'selected' : ''}>第${x.number}課</option>`,
      )
      .join('')
    sel.onchange = () => (location.search = '?l=' + sel.value)
    decks = build(l)
    setMode('vocab')
  })
</script>
