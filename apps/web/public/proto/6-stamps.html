<!doctype html><meta charset="utf-8" /><meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/><title>Stamps</title>
<link rel="stylesheet" href="base.css" />
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #2f3e46;
    font-family: 'Hiragino Mincho ProN', Georgia, serif;
    color: #222;
    padding: 26px 14px;
  }
  .book {
    max-width: 820px;
    margin: 0 auto;
    background: #1e2a78;
    padding: 14px 14px 14px 36px;
    border-radius: 6px 16px 16px 6px;
    box-shadow: 0 24px 50px #0006;
    position: relative;
  }
  .book:before {
    content: '';
    position: absolute;
    left: 12px;
    top: 0;
    bottom: 0;
    width: 4px;
    background: repeating-linear-gradient(#fff3 0 10px, transparent 10px 20px);
  }
  .cover {
    color: #f2d27a;
    text-align: center;
    padding: 10px 0 16px;
  }
  .cover h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
  }
  .cover small {
    letter-spacing: 0.15em;
    opacity: 0.8;
  }
  .page {
    background: #f8f1e1;
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .page h2 {
    margin: 0 0 4px;
    font-size: 19px;
    display: flex;
    justify-content: space-between;
  }
  .page .ir-en {
    font-style: italic;
    margin-bottom: 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .slot {
    aspect-ratio: 1;
    border: 2px dashed #b9a982;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #8f8260;
    cursor: pointer;
    text-align: center;
    padding: 6px;
    background: none;
    font-family: inherit;
    --c: #b5382b;
  }
  .slot.got {
    border: 0;
  }
  .slot:hover {
    background: #fff6;
  }
  .stamp {
    width: 78px;
    height: 78px;
    border: 5px double var(--c);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 28px;
    font-weight: 700;
    color: var(--c);
    transform: rotate(var(--r));
    opacity: 0.9;
  }
  .slot small {
    display: block;
    margin-top: 5px;
    line-height: 1.25;
    color: #333;
  }
  .slot.got.on {
    background: #fff9;
  }
  .lessons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .lessons a {
    display: block;
    background: #fff8;
    padding: 10px;
    text-decoration: none;
    color: #222;
    border: 1px solid #0002;
  }
  .lessons a:hover {
    background: #fff;
  }
  .reader {
    background: #fffdf6;
    border-radius: 4px;
    padding: 22px;
    margin-bottom: 14px;
    font-size: 18px;
  }
  .reader .x {
    float: right;
    cursor: pointer;
    border: 0;
    background: none;
    font-size: 20px;
  }
  .nav {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
  }
  .nav button {
    font: inherit;
    padding: 8px 16px;
    border: 1px solid #222;
    background: none;
    cursor: pointer;
  }
  .ir-play {
    background: #b5382b;
    color: #fff;
  }
  .ir-opt {
    background: none;
    border: 1px solid #222;
    padding: 6px 12px;
  }
  .ir-opt.picked {
    background: #222;
    color: #fff;
  }
  .ir-in {
    border: 0;
    border-bottom: 2px solid #222;
    background: none;
    color: #b5382b;
    width: 6em;
    outline: none;
  }
  .ir-check {
    border: 1px solid #222;
    background: none;
    padding: 4px 12px;
    cursor: pointer;
  }
  .ir-instr {
    border-left: 3px solid #b5382b;
    padding-left: 10px;
  }
  .ir-turn {
    font-size: 19px;
  }
  .ir-turn b {
    color: #b5382b;
  }
</style>
<div class="book" id="bk"></div>
<script src="lib.js"></script>
<script>
  IR.wire()
  const qs = new URLSearchParams(location.search),
    K = 'irodori.stamps',
    got = new Set(JSON.parse(localStorage[K] || '[]')),
    bk = document.getElementById('bk')
  const save = () => (localStorage[K] = JSON.stringify([...got])),
    COL = ['#b5382b', '#1f6f8b', '#6b8e23', '#8a5a9b', '#c47f00'],
    glyph = (s) =>
      s.kind === 'activity'
        ? [...(s.title?.text || '')][0]
        : { kanji: '漢', grammar: '文', scripts: '聴' }[s.kind]
  const label = (s) =>
    s.kind === 'activity'
      ? s.title
        ? IR.t(s.title)
        : s.id
      : { kanji: '漢字', grammar: 'Grammar notes', scripts: 'Scripts' }[s.kind]
  let IX,
    L = null,
    read = null
  function stamp(n, s, c, i) {
    const k = `${n}.${s.id}`
    return `<button class="slot ${got.has(k) ? 'got' : ''}" style="--c:${c}" data-k="${k}" data-l=${n} data-s="${s.id}">${got.has(k) ? `<div class=stamp style="--r:${((i * 37) % 24) - 12}deg">${glyph(s)}</div>` : `<div style="font-size:26px;opacity:.35">${glyph(s)}</div>`}<small>${label(s)}</small></button>`
  }
  function home() {
    bk.innerHTML =
      `<div class=cover><h1>朱 印 帳</h1><small>${IX.book.title.ja} · ${IX.book.title.en}</small></div>` +
      IX.chapters
        .map(
          (c, ci) =>
            `<div class=page><h2><span>${c.number} ${c.topic.ja}</span><span>${c.lessons.reduce((a, l) => a + l.sections.filter((s) => got.has(l.number + '.' + s.id)).length, 0)} / ${c.lessons.reduce((a, l) => a + l.sections.length, 0)}</span></h2><div class=ir-en>${c.topic.en}</div><div class=lessons>${c.lessons.map((l) => `<a href="?l=${l.number}"><b>第${l.number}課</b><br>${l.title.ja}<br><small>${l.sections.filter((s) => got.has(l.number + '.' + s.id)).length}/${l.sections.length} stamps</small></a>`).join('')}</div></div>`,
        )
        .join('')
  }
  async function lesson(n) {
    L = await IR.load(n)
    const lv = IX.chapters.flatMap((c) => c.lessons).find((x) => x.number === n),
      ci = IX.chapters.findIndex((c) => c.lessons.includes(lv))
    drawLesson(lv, COL[ci % 5])
  }
  function drawLesson(lv, c) {
    const n = lv.number
    bk.innerHTML = `<div class=cover><h1>第${n}課</h1><small><a href="6-stamps.html" style="color:inherit">← all lessons</a></small></div><div class=page><h2><span>${IR.t({ text: L.title.ja })}</span><span>${lv.sections.filter((s) => got.has(n + '.' + s.id)).length} / ${lv.sections.length}</span></h2><div class=ir-en>${IR.esc(L.title.en)} · ${IR.esc(L.topic.en)}</div>${L.question.ja ? `<p>${IR.t(L.question.ja)}<span class=ir-en>${IR.esc(L.question.en)}</span></p>` : ''}<div class=grid>${lv.sections.map((s, i) => stamp(n, s, c, i)).join('')}</div></div><div id=rd></div>`
    if (read) open(read.s, read.u)
  }
  function open(sid, u = 0) {
    const lv = IX.chapters.flatMap((c) => c.lessons).find((x) => x.number === L.number),
      s = lv.sections.find((x) => x.id === sid)
    read = { s: sid, u }
    let b = '',
      total = 1
    if (s.kind === 'activity') {
      const a = L.activities.find((a) => 'activity-' + a.number === sid),
        us = IR.units(a)
      total = us.length
      const x = us[u]
      b = `<p class=ir-en>${u + 1}/${total} · ${IR.t(x.step.title)} · ${IR.kind(x.task.kind)}</p>${IR.task(L, x.task)}`
    } else if (s.kind === 'kanji') b = IR.kanji(L.kanji)
    else if (s.kind === 'grammar')
      b = L.notes.map((n) => `<div style="margin:20px 0">${IR.note(L, n)}</div>`).join('')
    else b = IR.scripts(L, L.scripts)
    const done = u >= total - 1
    rd.innerHTML = `<div class=reader><button class=x onclick="read=null;rd.innerHTML=''">×</button><h3>${label(s)}</h3>${b}<div class=nav><button ${u == 0 ? 'disabled' : ''} onclick="open('${sid}',${u - 1})">←</button><button onclick="${done ? `stampIt('${L.number}.${sid}')` : `open('${sid}',${u + 1})`}">${done ? '押す · Stamp it' : '→'}</button></div></div>`
    rd.scrollIntoView({ behavior: 'smooth' })
  }
  window.stampIt = (k) => {
    got.add(k)
    save()
    const lv = IX.chapters.flatMap((c) => c.lessons).find((x) => x.number === L.number)
    read = null
    drawLesson(lv, COL[IX.chapters.findIndex((c) => c.lessons.includes(lv)) % 5])
  }
  bk.onclick = (e) => {
    const b = e.target.closest('.slot')
    if (b) open(b.dataset.s)
  }
  IR.index().then((ix) => {
    IX = ix
    qs.get('l') ? lesson(+qs.get('l')) : home()
  })
</script>
